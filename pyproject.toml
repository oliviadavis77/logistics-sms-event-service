[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logistics-sms-event-service"
version = "0.1.0"
description = "Typed logistics event service that sends transactional SMS alerts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
shipment-alerts = "shipment_alerts.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shipment_alerts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

